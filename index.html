<!DOCTYPE html>
<html>
<head>
    <title>Cryptid Test</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        #forest {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(#315b38, #102414);
            padding-top: 100px;
        }

        button {
            padding: 20px 40px;
            font-size: 22px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="start">
        <h1>CRYPTID PHOTOGRAPHER</h1>

        <p>Click the button to enter the forest.</p>

        <button onclick="startGame()">
            START GAME
        </button>
    </div>

    <div id="forest">
        <h1>🌲 YOU ARE IN THE FOREST 🌲</h1>
        <p>IT WORKED!</p>
    </div>

    <script>
        function startGame() {
            document.getElementById("start").style.display = "none";
            document.getElementById("forest").style.display = "block";
        }
    </script>

</body>
</html>
